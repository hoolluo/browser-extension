<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>批量网页文本提取器</title>
    <style>
        :root {
            --brand: #2563eb;
            --brand-dark: #1d4ed8;
            --border: #e8edf5;
            --text: #111827;
            --muted: #94a3b8;
            --soft: #f1f5f9;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
        }

        body {
            width: 360px;
            padding: 16px;
            font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            font-size: 13px;
            color: var(--text);
            background: #fff;
        }

        button {
            font-family: inherit;
        }

        h1,
        h2,
        p {
            margin: 0;
        }

        /* 顶部标题 */
        .app-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-icon {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .app-icon svg {
            width: 24px;
            height: 24px;
        }

        .app-title h1 {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.3;
        }

        .app-title p {
            margin-top: 2px;
            font-size: 12px;
            color: var(--muted);
        }

        .icon-btn {
            margin-left: auto;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #64748b;
            cursor: pointer;
        }

        .icon-btn:hover {
            background: var(--soft);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 窗口选择 */
        .window-section {
            margin-top: 16px;
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .section-head h2 {
            font-size: 14px;
            font-weight: 700;
        }

        .select-wrap {
            position: relative;
        }

        .select-wrap select {
            appearance: none;
            min-width: 148px;
            padding: 7px 28px 7px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
            color: #334155;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
        }

        .select-wrap select:hover {
            border-color: #cbd5e1;
        }

        .select-wrap select:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .select-wrap svg {
            position: absolute;
            right: 9px;
            top: 50%;
            width: 14px;
            height: 14px;
            transform: translateY(-50%);
            fill: none;
            stroke: #64748b;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .meta-line {
            margin-top: 9px;
            font-size: 12px;
            color: var(--muted);
        }

        /* 提取范围 */
        .segmented {
            display: flex;
            margin-top: 12px;
            border-radius: 8px;
            background: #f1f3f6;
            overflow: hidden;
        }

        .seg-btn {
            flex: 1;
            height: 34px;
            padding: 0;
            border: none;
            background: transparent;
            color: #4b5563;
            font-size: 13px;
            cursor: pointer;
            transition: background .15s ease, color .15s ease;
        }

        .seg-btn + .seg-btn {
            border-left: 1px solid #dde2e8;
        }

        .seg-btn:hover:not(.active):not(:disabled) {
            background: #e7ebf0;
        }

        .seg-btn.active {
            background: #fff;
            color: #111827;
            font-weight: 600;
            border-radius: 7px;
            box-shadow: inset 0 0 0 1px #d8dee6, 0 1px 2px rgba(16, 24, 40, .06);
        }

        .seg-btn.active + .seg-btn {
            border-left-color: transparent;
        }

        .seg-btn:disabled {
            cursor: not-allowed;
            opacity: .6;
        }

        /* 自定义链接 */
        .custom-panel {
            margin-top: 10px;
        }

        .custom-panel textarea {
            width: 100%;
            min-height: 78px;
            resize: vertical;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 9px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 12px;
            color: var(--text);
            outline: none;
        }

        .custom-panel textarea:focus {
            border-color: #93c5fd;
        }

        .custom-panel textarea:disabled {
            background: #f8fafc;
        }

        .hint {
            margin-top: 6px;
            font-size: 11px;
            line-height: 1.5;
            color: var(--muted);
        }

        /* 开始按钮 */
        .start-row {
            display: flex;
            justify-content: center;
            margin: 16px 0 4px;
        }

        .start-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 30px;
            border: none;
            border-radius: 10px;
            background: var(--brand);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(37, 99, 235, .25);
            transition: background .15s ease;
        }

        .start-btn:hover:not(:disabled) {
            background: var(--brand-dark);
        }

        .start-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
            box-shadow: none;
        }

        .start-btn svg {
            width: 17px;
            height: 17px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 结果 */
        .results-panel {
            margin-top: 12px;
        }

        .results {
            max-height: 240px;
            overflow: auto;
        }

        .empty {
            padding: 14px 0;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 6px;
            overflow: hidden;
            background: #fff;
        }

        .card summary {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 7px 10px;
            background: #f8fafc;
            font-size: 12px;
            cursor: pointer;
            list-style: none;
        }

        .card summary::-webkit-details-marker {
            display: none;
        }

        .card-title {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            flex-shrink: 0;
            color: var(--muted);
        }

        .card-url {
            padding: 0 10px 6px;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            color: var(--muted);
            word-break: break-all;
        }

        .card pre {
            margin: 0;
            padding: 9px 10px;
            max-height: 160px;
            overflow: auto;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* 分隔线与操作区 */
        .divider {
            height: 1px;
            margin: 14px 0;
            background: #f1f5f9;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .action-btn {
            height: 52px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
            color: #374151;
            font-size: 12px;
            cursor: pointer;
            transition: background .15s ease, border-color .15s ease;
        }

        .action-btn:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #dbe3ef;
        }

        .action-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 底部状态 */
        .footer {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #f1f5f9;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 9px;
            border-radius: 999px;
            background: #ecfdf5;
            color: #15803d;
            font-size: 12px;
            font-weight: 600;
        }

        .badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .badge[data-state="running"] {
            background: #eff6ff;
            color: #2563eb;
        }

        .badge[data-state="error"] {
            background: #fef2f2;
            color: #dc2626;
        }

        .status-text {
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chevron-btn {
            margin-left: auto;
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
        }

        .chevron-btn:hover {
            background: var(--soft);
        }

        .chevron-btn svg {
            width: 15px;
            height: 15px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform .2s ease;
        }

        .chevron-btn.open svg {
            transform: rotate(180deg);
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <header class="app-header">
        <div class="app-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 969.97 969.97">
                <path class="fil1" fill="#fff" stroke="none" d="M245.12 385.28c27.42,0 49.85,-22.15 49.85,-49.85l0 -49.85 115.23 0 0 398.83 -24.93 0c-27.42,0 -49.85,22.15 -49.85,49.85 0,27.7 22.43,49.85 49.85,49.85l24.93 0 149.56 0 24.93 0c27.42,0 49.85,-22.15 49.85,-49.85 0,-27.7 -22.44,-49.85 -49.85,-49.85l-24.93 0 0 -398.83 115.23 0 0 49.85c0,27.7 22.44,49.85 49.85,49.85 27.42,0 49.85,-22.15 49.85,-49.85l0 -99.71c0,-27.7 -22.44,-49.85 -49.85,-49.85l-165.08 0 -149.56 0 -165.08 0c-27.42,0 -49.85,22.16 -49.85,49.85l0 99.71c0,27.7 22.43,49.85 49.85,49.85z" />
            </svg>
        </div>
        <div class="app-title">
            <h1>批量网页文本提取器</h1>
            <p>提取网页可见文本内容</p>
        </div>
        <button class="icon-btn" id="settingsBtn" title="扩展设置" aria-label="扩展设置">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
        </button>
    </header>

    <section class="window-section">
        <div class="section-head">
            <h2>浏览器窗口</h2>
            <div class="select-wrap">
                <select id="windowSelect"></select>
                <svg viewBox="0 0 24 24">
                    <path d="M6 9l6 6 6-6" />
                </svg>
            </div>
        </div>
        <p class="meta-line" id="tabCountLine">正在读取窗口信息…</p>
    </section>

    <div class="segmented" role="tablist" aria-label="提取范围">
        <button class="seg-btn active" data-scope="all" role="tab" aria-selected="true" title="提取所选窗口中的全部标签页">全部标签页</button>
        <button class="seg-btn" data-scope="selected" role="tab" aria-selected="false" title="按住 Ctrl 或 Cmd 可同时选中多个标签页">选中标签页</button>
        <button class="seg-btn" data-scope="custom" role="tab" aria-selected="false" title="手动输入多个链接">自定义范围</button>
    </div>

    <section class="custom-panel hidden" id="customPanel">
        <textarea id="urlInput" spellcheck="false" placeholder="每行一个链接，例如：&#10;https://example.com&#10;www.example.org/article"></textarea>
        <p class="hint">支持自动补全 https://，提取时在后台标签页逐个打开，期间请保持弹窗打开。</p>
    </section>

    <div class="start-row">
        <button class="start-btn" id="startBtn">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <path d="M10.5 8.5l5 3.5-5 3.5z" fill="currentColor" stroke="none" />
            </svg>
            <span>开始提取</span>
        </button>
    </div>

    <section class="results-panel hidden" id="resultsPanel">
        <div class="results" id="results"></div>
        <p class="empty" id="emptyHint">还没有提取结果，点击「开始提取」试试</p>
    </section>

    <div class="divider"></div>

    <div class="actions">
        <button class="action-btn" id="copyBtn" disabled>
            <svg viewBox="0 0 24 24">
                <rect x="9" y="9" width="11" height="11" rx="2" />
                <path d="M5 15V6a2 2 0 0 1 2-2h9" />
            </svg>
            <span>复制全部</span>
        </button>
        <button class="action-btn" id="downloadBtn" disabled>
            <svg viewBox="0 0 24 24">
                <path d="M12 4v10" />
                <path d="M8 10.5l4 4 4-4" />
                <path d="M5 19h14" />
            </svg>
            <span>下载 .txt</span>
        </button>
        <button class="action-btn" id="clearBtn" disabled>
            <svg viewBox="0 0 24 24">
                <path d="M4 7h16" />
                <path d="M9 7V5h6v2" />
                <path d="M6 7l1 12h10l1-12" />
                <path d="M10 11v5M14 11v5" />
            </svg>
            <span>清空</span>
        </button>
    </div>

    <div class="footer">
        <span class="badge" id="statusBadge" data-state="idle">
            <span class="dot"></span>
            <span id="statusBadgeText">就绪</span>
        </span>
        <span class="status-text" id="statusText">等待提取任务</span>
        <button class="chevron-btn" id="resultsToggle" title="展开/收起结果" aria-label="展开或收起结果" aria-expanded="false">
            <svg viewBox="0 0 24 24">
                <path d="M6 9l6 6 6-6" />
            </svg>
        </button>
    </div>

    <script src="popup.js"></script>
</body>

</html>
